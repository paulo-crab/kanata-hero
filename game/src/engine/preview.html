<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Engine preview</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; height: 100%; background: #0E1020; overflow: hidden; }
  #stage { position: relative; width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center; }
  canvas { image-rendering: pixelated; }
  #msg { position: fixed; left: 8px; top: 8px; color: #D0D4E4; font: 12px monospace; }
</style>
</head>
<body>
<div id="stage"><canvas id="world"></canvas></div>
<div id="msg"></div>
<script type="module">
// Dev harness for the engine: draws the Orientation hub. Not part of the shipped game.
import { loadGameData, loadAtlasSet, World, Renderer, GameLoop } from './index.js';
import { RealClock } from '../shared/index.js';

const q = new URLSearchParams(location.search);
const data = await loadGameData();
const atlases = await loadAtlasSet({ map: data.map });
const world = new World(data, atlases);
if (q.has('x')) world.avatar.teleport([+q.get('x'), +q.get('y')], q.get('f') || 's');
if (q.get('open')) world.openGate(q.get('open'));
if (q.get('glitch')) world.spawnGlitch('glitch_lobby');
const canvas = document.getElementById('world');
const stageEl = document.getElementById('stage');
const renderer = new Renderer({ canvas, atlases, stageEl });
const fit = () => renderer.resize(innerWidth, innerHeight);
addEventListener('resize', fit);
fit();
const keys = { ArrowUp: 'n', ArrowDown: 's', ArrowLeft: 'w', ArrowRight: 'e' };
addEventListener('keydown', (e) => { if (keys[e.key]) { world.avatar.setHeld(keys[e.key]); e.preventDefault(); } });
addEventListener('keyup', (e) => { if (keys[e.key] && world.avatar.held === keys[e.key]) world.avatar.setHeld(null); });
const loop = new GameLoop({
  clock: new RealClock(),
  update: (ms) => world.update(ms),
  render: () => renderer.draw(world.snapshot()),
  raf: (f) => requestAnimationFrame(f),
  caf: (h) => cancelAnimationFrame(h),
});
loop.start();
window.__engine = { world, renderer, loop, atlases };
document.getElementById('msg').textContent = `zoom x${renderer.zoom}`;
</script>
</body>
</html>
